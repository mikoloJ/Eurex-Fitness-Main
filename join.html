<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Now | Eurex Fitness</title>
  <meta name="description" content="Join Eurex Fitness: classes, weight-loss coaching, books and courses by Dania Eunice.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="join">
  <header class="site-header" id="site-header"></header>
  <section class="page-hero" id="page-hero"></section>

  <section class="section">
    <div class="wrap">
      <div class="form-card">
        <!-- This form works automatically on Netlify.
             Submissions appear in your Netlify dashboard under "Forms". -->
        <form name="join-eurex" method="POST" data-netlify="true"
              netlify-honeypot="bot-field" action="/success.html">
          <input type="hidden" name="form-name" value="join-eurex">
          <p style="display:none"><label>Don't fill this out: <input name="bot-field"></label></p>

          <div class="form-row">
            <div class="field">
              <label for="name">Full name</label>
              <input type="text" id="name" name="name" required placeholder="Your name">
            </div>
            <div class="field">
              <label for="phone">Phone / WhatsApp</label>
              <input type="tel" id="phone" name="phone" required placeholder="+234 ...">
            </div>
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
          </div>

          <div class="form-row">
            <div class="field">
              <label for="interest">I'm interested in</label>
              <select id="interest" name="interest" required>
                <option value="">Choose one…</option>
                <option>Group Classes</option>
                <option>Weight-Loss Program</option>
                <option>VIP Coaching</option>
                <option>Books</option>
                <option>Courses</option>
                <option>Not sure yet, recommend for me</option>
              </select>
            </div>
            <div class="field">
              <label for="goal">Main goal</label>
              <select id="goal" name="goal">
                <option>Lose weight</option>
                <option>Get fit / tone up</option>
                <option>Improve overall wellness</option>
                <option>Other</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="message">Anything we should know? (optional)</label>
            <textarea id="message" name="message" placeholder="Your schedule, health conditions, questions…"></textarea>
          </div>

          <button type="submit" class="btn btn-solid btn-wide">Send: Join Eurex Fitness</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/content.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
